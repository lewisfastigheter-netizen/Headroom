    period: 2026Q2
    source: cw_investment
    note: "Closed transactions over SEK 40m"
    rows:
      - {segment: residential, deals: 59, sek_m: 17845, prime_yield: 3.75}
      - {segment: logistics, label: "Industrial and logistics", deals: 46, sek_m: 12899, prime_yield: 4.85}
      - {segment: office, deals: 11, sek_m: 10381, prime_yield: 3.75}
      - {segment: retail, deals: 21, sek_m: 7891, prime_yield: 4.45, note: "Shopping centre yield"}
      - {segment: other, label: "Other (community, hotel, mixed)", deals: 42, sek_m: 22585}
  totals:
    - {period: "H1 2026", value: "SEK 148bn", note: "Q1 the strongest in over 20 years", source: newsec}
    - {period: "H1 2026", value: "SEK ~122bn", note: "+74% y/y, just over 160 deals; 91% domestic buyers", source: jll_autumn}
    - {period: "H1 2026", value: "EUR 11.2bn", note: "+63% y/y; residential 25%, industrial 22%, office 13%", source: cw_nordic}
    - {period: "H1 2026", value: "EUR 9.7bn", note: "+43% y/y, 180 deals over EUR 5m; foreign buyers 18%", source: colliers}
    - {period: "2026 forecast", value: "SEK 300bn", note: "Would be the second-strongest year on record", source: newsec}
    - {period: "2025", value: "SEK 166bn", note: "Full year", source: newsec}
    - {period: "2025", value: "SEK ~150bn", note: "Full year, +6% y/y", source: svefa}

