# Market evidence for the Underwriting page, entered by hand from published research.
#
# Every figure has a source id (below), the period it describes and, where the source
# gives one, the page. Figures are quoted as published: yields and vacancy in per cent,
# rents in SEK per sq m and year (net, as the source states), volumes in SEK m unless the
# unit says otherwise. Nothing here is estimated by Headroom.
#
# Broker research is published for marketing; the figures are facts quoted with
# attribution, not reproduced reports. Update when the next quarter is out: Cushman &
# Wakefield MarketBeat (quarterly, mid-month after quarter end), Newsec Property Outlook
# (spring, autumn), JLL Nordic Outlook (spring, autumn), Colliers (half-year), and the
# listed companies' interim reports (valuation yields).

