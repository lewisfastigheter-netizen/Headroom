# Financing evidence. Live rates (Riksbank, SCB) and bond margins (ESMA FIRDS) come from
# the snapshot; these are the published points that the data cannot give.
financing:
  - {topic: "Bank appetite", text: "Nordic banks are cautious above 60% LTV/LTC.", source: jll_spring, page: 6}
  - {topic: "Alternative lenders", text: "Bullet loans at 65–75% LTV, margins from the mid-200s to low-300s bp.", source: jll_spring, page: 6}
  - {topic: "5-year SEK swap", text: "About 2.50% in early 2026.", source: jll_spring, page: 6}
  - {topic: "Bond market", text: "Real estate companies issued about SEK 114bn of SEK bonds in 2025 (SEK 90bn in 2024); A-rated share about 26%.", source: jll_spring, page: 6}
  - {topic: "New bond margins", text: "Svenska Handelsfastigheter 3y 90 bp and 5y 122 bp; Platzer 4y 138 bp and 5y 150 bp (unsecured); Vacse 5y 78 bp; Stenvalvet 3y 110 bp (unsecured); Stendörren hybrid 375 bp. April–May 2026.", source: ncr}
  - {topic: "Coverage", text: "Average ICR 2.9x and debt maturity 2.9 years across NCR's rated Swedish property issuers at 31 March 2026.", source: ncr}
  - {topic: "Bank financing conditions", text: "Bank competition and capital-market pressure on margins keep improving financing conditions; expectations of a near-term Riksbank hike have grown.", source: jll_autumn}
