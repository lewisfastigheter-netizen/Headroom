# Operating margin (NOI over rental income, H1 2026) of listed owners: a sourced default
# for property costs when no rent roll is at hand.
noi_margins:
  - {company: Wallenstam, segment: residential, value: 75.0, note: "Residential and commercial, Stockholm and Gothenburg, Jan–Jun 2026", page: 6, source: wallenstam}
  - {company: Catena, segment: logistics, value: 83.9, note: "Logistics, most costs re-invoiced to tenants, Jan–Jun 2026", page: 24, source: catena}
  - {company: NP3 Fastigheter, segment: light_industrial, value: 74.0, note: "Industrial and logistics, northern Sweden, Jan–Jun 2026", page: 3, source: np3}

# Swedish transaction volume.
volumes:
