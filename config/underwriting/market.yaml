# Markets as the brokers define them. `market_of` in model/underwriting.py maps a
# municipality to one of these by SCB's metropolitan areas: Stockholm = Greater Stockholm
# (Stockholms län); Gothenburg = Greater Gothenburg; Malmö = Greater Malmö for housing,
# offices and retail; Öresund = Skåne for logistics and light industrial; Regional =
# everything else.

# Prime yields, per cent. `segment` uses the app's segment keys.
prime_yields:
  - {segment: residential, market: stockholm, value: 3.75, note: "Stockholm A, new production; −5 bp in Q2", source: cw_residential}
  - {segment: residential, market: gothenburg, value: 4.30, note: "Gothenburg A, new production; −5 bp in Q2", source: cw_residential}
  - {segment: residential, market: malmo, value: 4.50, note: "Malmö A, new production; unchanged in Q2", source: cw_residential}
  - {segment: logistics, market: stockholm, value: 4.85, note: "−5 bp y/y", source: cw_logistics}
  - {segment: logistics, market: gothenburg, value: 4.85, note: "−5 bp y/y", source: cw_logistics}
  - {segment: logistics, market: oresund, value: 5.20, note: "−5 bp y/y", source: cw_logistics}
  - {segment: logistics, market: regional, value: 5.35, note: "Regional cities; −15 bp y/y", source: cw_logistics}
  - {segment: office, market: stockholm, value: 3.75, note: "CBD; −15 bp y/y", source: cw_office}
  - {segment: office, market: gothenburg, value: 4.50, note: "CBD; −5 bp y/y", source: cw_office}
  - {segment: office, market: malmo, value: 4.80, note: "CBD; −5 bp y/y", source: cw_office}
  - {segment: retail, market: stockholm, value: 3.85, note: "High street", source: cw_retail}
  - {segment: retail, market: gothenburg, value: 4.90, note: "High street", source: cw_retail}
  - {segment: retail, market: malmo, value: 5.95, note: "High street", source: cw_retail}
  - {segment: retail_park, market: stockholm, value: 5.75, note: "Retail park", source: cw_retail}
  - {segment: retail_park, market: gothenburg, value: 6.00, note: "Retail park", source: cw_retail}
  - {segment: shopping_centre, market: stockholm, value: 4.45, note: "Shopping centre", source: cw_retail}
  - {segment: shopping_centre, market: gothenburg, value: 5.35, note: "Shopping centre", source: cw_retail}
  - {segment: shopping_centre, market: malmo, value: 6.20, note: "Shopping centre", source: cw_retail}

# Valuation yields of listed owners (weighted average direktavkastningskrav in the
# external or internal valuation at 30 June 2026). These are portfolio averages, not
# prime: they show where an owner of comparable stock is marked. `markets` (optional)
# limits which broker markets an owner is the reference for when no prime yield exists.
valuation_yields:
  - {company: Wallenstam, segment: residential, markets: [stockholm, gothenburg], value: 3.7, focus: "Residential in Stockholm, Gothenburg and Uppsala", page: 8, source: wallenstam}
  - {company: Sveafastigheter, segment: residential, markets: [regional], value: 5.9, focus: "Residential in regional growth towns; all assets valued by Newsec", page: 16, source: sveafastigheter}
  - {company: Catena, segment: logistics, value: 5.8, focus: "Nordic logistics (exit yield); EPRA NIY 5.4%", page: 8, source: catena}
  - {company: Stenhus Fastigheter, segment: light_industrial, value: 6.04, focus: "Light industrial, retail and offices, Sweden; range 4.15–8.50%", page: 22, source: stenhus}
  - {company: Sagax, segment: light_industrial, value: 6.3, focus: "Warehouse and light industrial, Nordics and Europe (Sweden 21% of value)", page: 12, source: sagax}
  - {company: NP3 Fastigheter, segment: light_industrial, markets: [regional], value: 7.04, focus: "Industrial and logistics, northern and central Sweden", page: 14, source: np3}
  - {company: Hemsö, segment: community, value: 5.0, focus: "Community service properties, Sweden (group 5.1%)", page: 7, source: hemso}
  - {company: Pandox, segment: hotel, value: 6.29, focus: "Leased hotel properties, Nordics and Europe (own operations 6.78%)", page: 9, source: pandox}

