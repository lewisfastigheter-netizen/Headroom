# Scoring configuration. Every number here is shown on the Method page.
# Edit, then reload the app. Weights within a score must sum to 1.0.

motivated_seller:
  weights:
    refinancing: 0.30
    covenant: 0.25
    leverage: 0.15
    events: 0.20
    market: 0.10     # listed companies only; re-weighted away for others

  # Below this share of the nominal weight, a company is not scored at all.
  min_coverage: 0.50

  # Each component maps a raw metric to 0-100 with a linear ramp between
  # `zero` (score 0) and `full` (score 100). Values beyond the ends are clipped.
  refinancing:
    # need = due within 12m + weight_12_24m * (due in months 13-24)
    weight_12_24m: 0.6
    # ratio = need / (cash + undrawn facilities), scored on a log scale because
    # ratios run from below 1x to 100x for issuers with near-zero liquidity
    scale: log
    ratio_zero: 0.75
    ratio_full: 10.0

  covenant:
    # headroom = distance to threshold as a share of the threshold
    # min-tests (ICR, equity ratio): (actual - threshold) / threshold
    # max-tests (LTV): (threshold - actual) / threshold
    # The tightest maintenance test is scored at base rates and again with ICR
    # recomputed at base + stress_bp. The component is the average of the two,
    # so an issuer already in breach scores above one that breaches only under stress.
    stress_bp: 100
    stress_weight: 0.5
    headroom_zero: 0.40   # 40% headroom or more scores 0
    headroom_full: 0.00   # at or through the covenant scores 100

  leverage:
    ltv:            {zero: 0.40, full: 0.70}
    icr:            {zero: 3.0,  full: 1.0}
    net_debt_ebitda: {zero: 8.0, full: 20.0}

  events:
    half_life_days: 180
    cap: 100
    # Points before decay. Several events add up, capped at `cap`.
    severity:
      written_procedure: 60
      waiver: 40
      interest_deferral: 70
      reconstruction: 90
      bankruptcy_in_group: 80
      liquidation: 80
      going_concern: 60
      late_annual_report: 25
      disposal_below_book: 30
      rating_downgrade: 30
      refinancing_completed: 0
      equity_raise: 15
      interim_report: 0
      disposal: 5

  market:
    pnav_discount: {zero: 0.0, full: 0.50}
    drawdown_52w:  {zero: 0.0, full: 0.60}

  bands:
    high: 60    # oxblood marker
    watch: 40   # ochre marker

strategy_fit:
  # A value-add mandate in Nordic residential, light industrial and logistics.
  weights:
    segment: 0.50
    region: 0.30
    size: 0.20
  target_segments: [residential, light_industrial, logistics]
  growth_regions: [Stockholm, Gothenburg, Malmö, Uppsala, Linköping, Örebro, Västerås, Helsinki, Oslo, Copenhagen]
  # Deal size, by property value in SEK m. Full score inside the band,
  # linear fade to zero at the outer bounds.
  size_sek_m:
    outer_low: 200
    band_low: 1000
    band_high: 15000
    outer_high: 40000

opportunity:
  # Thresholds used by the rule-based opportunity-type label.
  large_portfolio_sek_m: 3000
  wind_down_score: 75
  recap_ltv: 0.60

extraction:
  # Extracted fields below this confidence are shown as unverified.
  min_confidence: 0.80

rate_shock:
  max_bp: 300
  step_bp: 25

private_universe:
  # Private ABs from Bolagsverket's bulk file, kept if their latest annual report
  # shows at least this much property (fair value if disclosed, else book value; SEK m).
  min_property_value_sek_m: 20
  # New companies checked per run of `headroom private` (runs four times a day; in practice
  # the time limit below and Bolagsverket's rate limit decide how many).
  # About 1-3 API calls each; checked companies are recorded in data/private_checked.csv.
  max_lookups_per_run: 20000
  # Stop the private scan after this long so the job ends cleanly within GitHub's limit.
  max_minutes_per_run: 330
  # New companies checked during the weekly refresh (0 = leave it to the daily job).
  max_lookups_in_refresh: 0

location:
  # Location scores for the Locations page only; they do not feed the company scores.
  # Same pattern as motivated_seller: each component is a linear ramp from `zero`
  # (score 0) to `full` (score 100), clipped; `scale: log` ramps on log10 of the value.
  # Weights within a score sum to 1.0. Components without data are dropped and the
  # rest re-weighted; below `min_coverage` of the weight a place is not scored.
  min_coverage: 0.50
  bands:
    high: 65
    watch: 45

  residential:            # municipalities and counties
    weights:
      growth_5y: 0.20          # population growth per year, last 5 years
      housing_pressure: 0.20   # residents added per completed home, last 3 years
      young_inflow: 0.15       # net domestic inflow of 20-34-year-olds per 1,000 residents, 3-year mean
      bme: 0.15                # municipality's own housing-market assessment (Kolada U30446)
      pipeline: 0.10           # homes started per 1,000 residents, last 4 quarters (fewer = less new supply)
      income_rel: 0.10         # median income relative to Sweden
      education: 0.10          # share of 25-65-year-olds with 3+ years of post-secondary education
    growth_5y:        {zero: 0.000, full: 0.015}
    housing_pressure: {zero: 0.0,   full: 2.0}
    young_inflow:     {zero: -2.0,  full: 6.0}
    bme:              {zero: 2.0,   full: 0.0}    # surplus (2) scores 0, shortage (0) scores 100
    pipeline:         {zero: 5.0,   full: 1.0}
    income_rel:       {zero: 0.85,  full: 1.15}
    education:        {zero: 0.15,  full: 0.35}

  residential_regso:      # areas within cities
    weights:
      growth: 0.25             # per year over 5 years where the RegSO kept its borders, else 1 year
      share_20_34: 0.15        # the renter cohort
      rental_share: 0.15       # rental flats as a share of all dwellings
      sei_improvement: 0.20    # fall in SCB's socio-economic index over 10 years (higher index = more challenges)
      income_rel_kommun: 0.15  # mean net income relative to the municipality
      kommun_context: 0.10     # the municipality's Residential score
    growth:            {zero: 0.000, full: 0.020}
    share_20_34:       {zero: 0.12,  full: 0.25}
    rental_share:      {zero: 0.10,  full: 0.50}
    sei_improvement:   {zero: -0.5,  full: 3.0}   # percentage points
    income_rel_kommun: {zero: 0.75,  full: 1.10}
    kommun_context:    {zero: 0,     full: 100}

  logistics:              # municipalities and counties
    weights:
      catchment_100km: 0.25    # residents within 100 km, straight line
      logistics_lq: 0.20       # transport and warehousing (SNI H) share of local jobs / Sweden's share
      logistics_growth: 0.10   # growth per year in SNI H jobs at workplaces in the municipality
      node_distance: 0.15      # nearest port, intermodal terminal or cargo airport, km
      motorway_distance: 0.10  # nearest junction on E4, E6, E18 or E20, km
      job_hub: 0.10            # in-commuters / out-commuters
      industrial_cluster: 0.10 # employees in business areas (verksamhetsområden) per 1,000 residents
    catchment_100km:    {zero: 300000, full: 3000000, scale: log}
    logistics_lq:       {zero: 0.8,  full: 2.0}
    logistics_growth:   {zero: 0.0,  full: 0.04}
    node_distance:      {zero: 80.0, full: 10.0}
    motorway_distance:  {zero: 40.0, full: 3.0}
    job_hub:            {zero: 0.7,  full: 1.3}
    industrial_cluster: {zero: 50.0, full: 250.0}

  # Statements in the start-page headline.
  pressure_shortage: 2.0     # residents per completed home above this suggests a shortage
  min_percentile_n: 20       # no percentile from fewer comparable values
