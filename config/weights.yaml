# Scoring configuration. Every number here is shown on the Method page.
# Edit, then reload the app. Weights within a score must sum to 1.0.

motivated_seller:
  # Five parts, one rule each. Each part turns one figure into 0-100 on a straight line:
  # `zero` scores 0, `full` scores 100, anything beyond is clipped. The score is the
  # weighted average of the parts.
  weights:
    refinancing: 0.30
    covenant: 0.25   # companies with bonds only
    leverage: 0.15
    events: 0.20
    market: 0.10     # listed companies only

  # A part without data is left out and the others count for more. A part that does not
  # apply (covenants without bonds, share price without a listing) is left out too, but is
  # not a data gap. A company with data for less than this share of the weight that
  # applies to it is not scored.
  min_coverage: 0.55

  refinancing:
    # Debt due within 12 months / (cash + undrawn facilities). Log scale, because the
    # ratio runs from near zero to 100x: every doubling of the ratio adds 30 points.
    zero: 0.5     # 0.5x or less scores 0
    full: 5.0     # 5x or more scores 100

  covenant:
    # Headroom on the tightest maintenance covenant after interest rates rise by
    # stress_bp (only ICR moves). Headroom = distance to the threshold as a share of it:
    # (actual - threshold) / threshold for ICR and equity ratio, the reverse for LTV.
    stress_bp: 100
    zero: 0.40    # 40% headroom or more scores 0
    full: 0.00    # at or through the covenant scores 100

  leverage:
    # Average of the two.
    ltv: {zero: 0.40, full: 0.70}
    icr: {zero: 3.0,  full: 1.0}

  events:
    # Points for each event in the last 12 months, added up, capped at 100.
    window_days: 365
    cap: 100
    points:
      written_procedure: 60
      waiver: 40
      interest_deferral: 70
      reconstruction: 90
      bankruptcy_in_group: 80
      liquidation: 80
      going_concern: 60
      late_annual_report: 25
      disposal_below_book: 30
      rating_downgrade: 30
      equity_raise: 15
      disposal: 5

  market:
    # Discount of the share price to NAV per share. When NAV is not available,
    # the fall from the 52-week high is used instead.
    nav_discount: {zero: 0.0, full: 0.50}
    drawdown_52w: {zero: 0.0, full: 0.60}

  bands:
    high: 60    # oxblood marker
    watch: 40   # ochre marker

strategy_fit:
  # A value-add mandate in Nordic residential, light industrial and logistics.
  weights:
    segment: 0.50
    region: 0.30
    size: 0.20
  target_segments: [residential, light_industrial, logistics]
  growth_regions: [Stockholm, Gothenburg, Malmö, Uppsala, Linköping, Örebro, Västerås, Helsinki, Oslo, Copenhagen]
  # Deal size, by property value in SEK m. Full score inside the band,
  # linear fade to zero at the outer bounds.
  size_sek_m:
    outer_low: 200
    band_low: 1000
    band_high: 15000
    outer_high: 40000

opportunity:
  # Thresholds used by the rule-based opportunity-type label.
  large_portfolio_sek_m: 3000
  wind_down_score: 75
  recap_ltv: 0.60

extraction:
  # Extracted fields below this confidence are shown as unverified.
  min_confidence: 0.80

rate_shock:
  max_bp: 300
  step_bp: 25

private_universe:
  # Private ABs from Bolagsverket's bulk file, kept if their latest annual report
  # shows at least this much property (fair value if disclosed, else book value; SEK m).
  min_property_value_sek_m: 20
  # New companies checked per run of `headroom private` (runs four times a day; in practice
  # the time limit below and Bolagsverket's rate limit decide how many).
  # About 1-3 API calls each; checked companies are recorded in data/private_checked.csv.
  max_lookups_per_run: 20000
  # Stop the private scan after this long so the job ends cleanly within GitHub's limit.
  max_minutes_per_run: 330
  # New companies checked during the weekly refresh (0 = leave it to the daily job).
  max_lookups_in_refresh: 0

location:
  # Location scores for the Locations page only; they do not feed the company scores.
  # Each score has four parts. Each part turns one figure into 0-100 on a straight line:
  # `zero` scores 0, `full` scores 100, anything beyond is clipped (`scale: log` draws the
  # line on a log scale). The score is the weighted average of the parts. A part without
  # data is left out and the others count for more; a place with data for less than
  # `min_coverage` of the weight gets no score.
  min_coverage: 0.50
  bands:
    high: 65
    watch: 45

  residential:            # municipalities and counties: are people arriving faster than homes are built?
    weights:
      growth_5y: 0.30          # population growth per year, last 5 years
      housing_pressure: 0.30   # residents added per completed home, last 3 years
      young_inflow: 0.20       # 20-34-year-olds moving in from the rest of Sweden, net per 1,000 residents
      bme: 0.20                # the municipality's own view of its housing market (Kolada U30446)
    growth_5y:        {zero: -0.01, full: 0.01}   # shrinking 1% a year scores 0, growing 1% scores 100
    housing_pressure: {zero: 0.0,   full: 2.0}    # 2 or more new residents per new home scores 100
    young_inflow:     {zero: -5.0,  full: 1.0}
    bme:              {zero: 2.0,   full: 0.0}    # surplus (2) scores 0, balance (1) 50, shortage (0) 100

  residential_regso:      # areas within cities: is the area growing, rented and improving?
    weights:
      growth: 0.30             # per year since 2020 where the area kept its borders, else last year
      rental_share: 0.25       # rental flats as a share of all homes
      sei_improvement: 0.25    # fall in SCB's socio-economic index over 10 years (lower index = fewer challenges)
      kommun_context: 0.20     # the municipality's Residential score
    growth:            {zero: -0.01, full: 0.01}
    rental_share:      {zero: 0.10,  full: 0.50}
    sei_improvement:   {zero: -0.5,  full: 3.0}   # percentage points
    kommun_context:    {zero: 0,     full: 100}

  logistics:              # municipalities and counties: are there people within reach and a logistics base to serve them?
    weights:
      catchment_100km: 0.30    # residents within 100 km, straight line
      node_distance: 0.25      # nearest port, intermodal terminal or cargo airport, km
      logistics_lq: 0.25       # transport and warehousing (SNI H) share of local jobs / Sweden's share
      job_hub: 0.20            # people commuting in per person commuting out
    catchment_100km:    {zero: 300000, full: 3000000, scale: log}
    node_distance:      {zero: 100.0, full: 10.0}
    logistics_lq:       {zero: 0.5,   full: 1.5}
    job_hub:            {zero: 0.5,   full: 1.5}

  # Statements in the start-page headline.
  pressure_shortage: 2.0     # residents per completed home above this suggests a shortage
  min_percentile_n: 20       # no percentile from fewer comparable values
