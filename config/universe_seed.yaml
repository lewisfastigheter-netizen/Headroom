# Seed list for the live universe.
#
# The bond universe is discovered automatically: ESMA FIRDS gives every listed
# bond and its issuer LEI; GLEIF turns the LEI into a legal name, country and
# Swedish organisation number. Property companies are then identified by a
# keyword in the legal name (see model/universe.py) or by this seed list.
#
# Seeds are NAMES ONLY. Org numbers and LEIs are never typed in here: they are
# resolved from GLEIF at run time, so every identifier comes from the register.
# From milestone 4, Bolagsverket SNI codes (68.x) replace the name heuristic.

# Property companies whose legal name has no property keyword.
# Matched case-insensitively as a whole word in the GLEIF legal name.
property_names:
