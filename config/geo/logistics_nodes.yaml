# Logistics nodes used for "distance to the nearest port / intermodal terminal / cargo
# airport". Straight-line distance from a place's population-weighted centroid; the app
# says it is an approximation of drive time.
#
# Coordinates are copied from Wikidata (P625) or OpenStreetMap, retrieved 2026-10-09, and
# each entry names its object id so it can be checked. The list is not exhaustive: OSM and
# Wikidata only tag some of Sweden's intermodal terminals by name. Add a node with its
# coordinates and source, and rerun `uv run headroom locations`.
#
# Ports: the seven named in the brief plus other ports with regular freight traffic.
# Wikidata © CC0; OpenStreetMap © OpenStreetMap contributors, ODbL.

