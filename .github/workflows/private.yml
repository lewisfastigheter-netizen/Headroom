name: Private companies

# Checks the next batch of private property companies at Bolagsverket (SNI code,
# latest digitally filed annual report). Companies with at least SEK 20m of property
# go to data/private_found.jsonl, which the app merges into the live data. No LLM is
# used, so this costs nothing. Runs four times a day, each run for up to 5.5 hours,
# so the scan runs almost around the clock at Bolagsverket's rate limit.
# Candidates come from data/private_candidates.parquet; results are recorded in
# data/private_checked.csv so each run continues where the last one stopped. A run that
# succeeds starts the next one itself until every candidate has been checked, so the scan
# does not depend on GitHub's scheduler (which can delay or skip scheduled runs).
on:
  schedule:
    - cron: "41 */6 * * *"   # 00:41, 06:41, 12:41, 18:41 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write        # lets a finished run start the next batch

concurrency:
  group: private            # one scan at a time; writes only data/private_*
  cancel-in-progress: false

jobs:
  private:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Cache Bolagsverket responses
        uses: actions/cache@v4
        with:
          path: data/cache/bolagsverket
          key: bolagsverket-${{ github.run_id }}
          restore-keys: bolagsverket-

      - name: Check next batch of private companies
        env:
          HTTP_CONTACT: ${{ secrets.HTTP_CONTACT }}
          BOLAGSVERKET_CLIENT_ID: ${{ secrets.BOLAGSVERKET_CLIENT_ID }}
          BOLAGSVERKET_CLIENT_SECRET: ${{ secrets.BOLAGSVERKET_CLIENT_SECRET }}
        run: uv run headroom private

      - name: Progress summary
        if: always()
        run: uv run headroom private-status >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        run: |
          git config user.name "headroom-bot"
          git config user.email "headroom-bot@users.noreply.github.com"
          for f in data/private_checked.csv data/private_found.jsonl; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Private companies $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - name: Start the next batch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remaining=$(uv run python -c "from headroom.store.private import progress as p; x = p(); print(x['candidates'] - x['checked'])")
          echo "Candidates left: $remaining"
          if [ "$remaining" -gt 0 ]; then
            gh workflow run private.yml --ref "${{ github.ref_name }}"
          fi
