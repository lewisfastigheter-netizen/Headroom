[client]
toolbarMode = "minimal"
showErrorDetails = "stacktrace"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[theme]
# Forest green on warm paper. Newsreader for headings, Familjen Grotesk for text, IBM Plex Mono for dates.
base = "light"
primaryColor = "#3E6A11"            # olive green (accent)
backgroundColor = "#FCFAF7"         # paper
secondaryBackgroundColor = "#F3EFE9" # stone
textColor = "#1F1A21"               # ink
linkColor = "#625A66"               # graphite
linkUnderline = true
borderColor = "#E4DED6"             # hairline rule
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "none"
buttonRadius = "none"
baseFontSize = 15
baseFontWeight = 400
font = "'Familjen Grotesk':https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&display=swap"
headingFont = "Newsreader:https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
codeFontSize = "0.8rem"
codeBackgroundColor = "#F3EFE9"
codeTextColor = "#1F1A21"
headingFontWeights = [400, 400, 500, 500, 500, 500]
headingFontSizes = ["2.6rem", "1.75rem", "1.25rem", "1rem", "0.9rem", "0.8rem"]
metricValueFontSize = "2.25rem"
metricValueFontWeight = 400
chartCategoricalColors = ["#1F1A21", "#3E6A11", "#9C949F", "#625A66"]
chartSequentialColors = ["#F0F4ED", "#DEE7D9", "#C9D8BE", "#AEC4A0", "#92AE7F", "#74955D", "#597D3D", "#3E6A11", "#2B4F01", "#1F3B01"]
dataframeHeaderBackgroundColor = "#FCFAF7"
dataframeHeaderTextColor = "#625A66"
dataframeBorderColor = "#E4DED6"
redColor = "#D9571F"
orangeColor = "#B8891C"
yellowColor = "#B8891C"
greenColor = "#3E6A11"
blueColor = "#625A66"
violetColor = "#625A66"
grayColor = "#9C949F"

[theme.sidebar]
backgroundColor = "#F3EFE9"
